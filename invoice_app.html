/* ═══════════════════════════════════════════════
   PRINT SUMMARY  — landscape A4, one page, all cols
═══════════════════════════════════════════════ */
function printSummary(invList,mF,yF){
  const real=invList.filter(inv=>(inv.no||'').trim()&&(inv.billing?.name||'').trim());
  if(!real.length){toast('No completed invoices to print.','info');return;}
  const mn=MONTHS.find(m=>m.v===mF)?.l||'';
  const title=mn&&yF?`${mn} ${yF}`:mn||yF||'All';
  const genDate=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  let grandTotal=0;
  const rows=real.map((inv,i)=>{
    const C=calcInv(inv);grandTotal+=C.fin;
    const bg=i%2===0?'#ffffff':'#f5f7ff';
    return`<tr style="background:${bg}">
      <td style="text-align:center;font-weight:600">${i+1}</td>
      <td>${inv.no||'—'}</td>
      <td>${fmtD(inv.date)||'—'}</td>
      <td style="text-align:left">${inv.billing?.name||'—'}</td>
      <td>${inv.billing?.gstin||'—'}</td>
      <td style="text-align:left">${inv.vessel||'—'}</td>
      <td style="text-align:left">${inv.port||'—'}</td>
      <td>${inv.jobNo||'—'}</td>
      <td>${inv.poNo||'—'}</td>
      <td style="text-align:center">${inv.gst==='SC'?'SC':'IG'}</td>
      <td style="text-align:right;font-weight:600">₹${inrI(C.fin)}</td>
    </tr>`;
  }).join('');

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Invoice Summary — ${title}</title>
<style>
  @page{size:A4 landscape;margin:8mm}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;font-size:8.5pt;color:#000;background:#fff}
  .hdr{background:#e8f0fb;padding:8px 12px;border-bottom:2px solid #1a3a6b;margin-bottom:8px}
  .hdr h1{font-size:13pt;color:#1a3a6b;font-weight:bold}
  .hdr p{font-size:7.5pt;color:#555;margin-top:2px}
  .band{background:#1a3a6b;color:#fff;padding:5px 12px;font-size:9pt;font-weight:bold;margin-bottom:2px;display:flex;justify-content:space-between}
  table{width:100%;border-collapse:collapse;font-size:8pt}
  th{background:#1a3a6b;color:#fff;padding:5px 6px;text-align:center;font-size:7.5pt;font-weight:bold;white-space:nowrap;border:1px solid #0e2450}
  td{padding:4px 6px;border-bottom:0.5px solid #ddd;border-right:0.5px solid #eee;vertical-align:top;white-space:nowrap}
  td:nth-child(3),td:nth-child(5),td:nth-child(6){white-space:normal;word-break:break-word}
  .total-row{background:#1a3a6b!important;color:#fff;font-weight:bold}
  .total-row td{color:#fff;border-color:#0e2450;padding:6px}
  @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div class="hdr">
  <h1>${CO.name}</h1>
  <p>${CO.l1}, ${CO.l2} &nbsp;·&nbsp; GSTIN: ${CO.gstin} &nbsp;·&nbsp; ${CO.ph}</p>
</div>
<div class="band">
  <span>INVOICE SUMMARY — ${title}</span>
  <span>Generated: ${genDate} &nbsp;·&nbsp; ${real.length} Invoice${real.length!==1?'s':''}</span>
</div>
<table>
  <thead><tr>
    <th style="width:3%">Sr</th>
    <th style="width:9%">Invoice No</th>
    <th style="width:6%">Date</th>
    <th style="width:15%">Party Name</th>
    <th style="width:12%">GSTIN</th>
    <th style="width:11%">Vessel / Ship</th>
    <th style="width:10%">Port</th>
    <th style="width:8%">Job / Ref</th>
    <th style="width:8%">PO / Ref</th>
    <th style="width:5%">GST</th>
    <th style="width:8%">Amount (₹)</th>
  </tr></thead>
  <tbody>${rows}</tbody>
  <tfoot><tr class="total-row">
    <td colspan="10" style="text-align:right">GRAND TOTAL</td>
    <td style="text-align:right">₹${inrI(grandTotal)}</td>
  </tr></tfoot>
</table>
<script>window.onload=function(){window.print();}<\/script>
</body></html>`;

  const w=window.open('','_blank');
  if(w){w.document.write(html);w.document.close();}
  else toast('Allow popups to print the summary.','info');
}

/* ═══════════════════════════════════════════════
   EXPORT MENU
═══════════════════════════════════════════════ */
function ExportMenu({filtered,mF,yF,enableFullExcel}){
  const[open,setOpen]=useState(false);
  const ref=useRef();
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);
  },[]);
  const btnStyle={width:'100%',textAlign:'left',borderRadius:0,
    padding:'10px 14px',fontSize:'13px',border:'none',borderBottom:'1px solid var(--border)',
    display:'flex',alignItems:'center',gap:'8px'};
  const btnStyleLast={...btnStyle,borderBottom:'none'};
  return(
    <div ref={ref} style={{position:'relative',flexShrink:0}}>
      <button className="btn btn-ghost btn-sm" onClick={()=>setOpen(o=>!o)}
        title="Export filtered invoices">⬆ Export ▾</button>
      {open&&(
        <div style={{position:'absolute',right:0,top:'calc(100% + 4px)',background:'var(--card)',
          border:'1.5px solid var(--border2)',borderRadius:'var(--rl)',boxShadow:'var(--shadow-lg)',
          zIndex:300,minWidth:'220px',overflow:'hidden'}}>

          {/* Print Summary — landscape A4, one page */}
          <button className="btn btn-ghost" style={btnStyle}
            onClick={()=>{printSummary(filtered,mF,yF);setOpen(false);}}
            title="Print landscape summary — all invoices on one page">
            🖨 Print Summary
          </button>

          {/* Summary Excel */}
          <button className="btn btn-ghost" style={btnStyle}
            onClick={()=>{exportExcel(filtered,mF,yF);setOpen(false);}}>
            📊 Export as Summary
          </button>

          {/* Full Report Excel — always visible */}
          <button className="btn btn-ghost" style={btnStyle}
            onClick={()=>{exportFullExcel(filtered,mF,yF);setOpen(false);}}
            title="Export all invoice fields — one row per item">
            📋 Export as Report
          </button>

          {/* JSON backup */}
          <button className="btn btn-ghost" style={btnStyleLast}
            onClick={()=>{
              let name='Invoice_All_Backup';
              if(mF&&yF){const mn=MONTHS.find(m=>m.v===mF)?.l||mF;name=`Invoice_${mn}-${yF}_Backup`;}
              else if(yF)name=`Invoice_${yF}_Backup`;
              else if(mF){const mn=MONTHS.find(m=>m.v===mF)?.l||mF;name=`Invoice_${mn}_Backup`;}
              dlJSON({version:5,exported:new Date().toISOString(),invoices:filtered},name+'.json');
              setOpen(false);
            }}>
            📦 Export as JSON (backup)
          </button>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════
   LIST VIEW
═══════════════════════════════════════════════ */
function ListView({invs,onNew,onEdit,onView,onDel,onImport,onUndo,undoCount,onOpenSettings,showFiltTotal,enableFullExcel}){
  const[q,setQ]=useState('');
  const cm=today().slice(5,7),cy=today().slice(0,4);
  const[mF,setMF]=useState(cm);
  const[yF,setYF]=useState(cy);
  const[noStor]=useState(()=>!ls.ok());

  const years=useMemo(()=>{
    const s=new Set(invs.map(i=>i.date?.slice(0,4)).filter(Boolean));s.add(cy);
    return[...s].sort((a,b)=>b-a);
  },[invs,cy]);

  const filtered=useMemo(()=>{
    let l=[...invs].sort((a,b)=>{
      // Sort newest first by date, then by invoice no desc
      const da=a.date||'',db=b.date||'';
      if(db!==da)return db.localeCompare(da);
      return(b.no||'').localeCompare(a.no||'');
    });
    if(mF)l=l.filter(i=>i.date?.slice(5,7)===mF);
    if(yF)l=l.filter(i=>i.date?.slice(0,4)===yF);
    if(q){const lq=q.toLowerCase();l=l.filter(i=>(i.no+' '+(i.billing?.name||'')+' '+(i.vessel||'')+' '+(i.port||'')+' '+(i.jobNo||'')).toLowerCase().includes(lq));}
    return l;
  },[invs,mF,yF,q]);

  const filtTotal=filtered.reduce((s,i)=>s+(calcInv(i).fin||0),0);

  // Stats: Total Invoices + Filtered count always shown; Filtered Total only if enabled
  const statCards=[
    ['Total Invoices',invs.length],
    ['Filtered',filtered.length],
    ...(showFiltTotal?[['Filtered Total','₹ '+inrI(filtTotal)]]:[] ),
  ];

  return(
    <div style={{padding:'1.5rem 2rem',maxWidth:'1240px',margin:'0 auto'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:'1.4rem',flexWrap:'wrap',gap:'10px'}}>
        <div>
          <h1 style={{fontSize:'22px',fontWeight:800,letterSpacing:'-.01em',marginBottom:'2px'}}>{CO.name}</h1>
          <div style={{fontSize:'12px',color:'var(--text3)'}}>GST Invoice Manager&nbsp;·&nbsp;GSTIN:&nbsp;<span style={{fontFamily:'monospace'}}>{CO.gstin}</span></div>
        </div>
        <div style={{display:'flex',gap:'7px',flexWrap:'wrap',alignItems:'center'}}>
          <button className="btn btn-ghost btn-sm" onClick={onUndo} disabled={undoCount===0}
            title={`Undo last action (${undoCount} available)`}>↩ Undo{undoCount>0?` (${undoCount})`:''}</button>
          <button className="btn btn-ghost btn-sm" onClick={onImport} title="Import JSON backup or Excel (.xlsx/.xlsm)">⬇ Import</button>
          <button className="btn btn-ghost btn-sm" onClick={onOpenSettings}>⚙ Settings</button>
          <button className="btn btn-primary" onClick={onNew} style={{padding:'8px 18px',fontSize:'14px'}}>＋ New Invoice</button>
        </div>
      </div>

      {noStor&&<div className="alert alert-warn">⚠ localStorage unavailable — data won't persist between sessions.</div>}

      {/* Stats */}
      <div style={{display:'grid',gridTemplateColumns:`repeat(${statCards.length},1fr)`,gap:'12px',marginBottom:'1.25rem'}}>
        {statCards.map(([l,v])=>(
          <div key={l} className="stat-card">
            <div style={{fontSize:'11px',fontWeight:700,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'5px'}}>{l}</div>
            <div style={{fontSize:'20px',fontWeight:700,fontFamily:'monospace'}}>{v}</div>
          </div>
        ))}
      </div>

      {/* Filters row */}
      <div style={{display:'flex',gap:'9px',marginBottom:'12px',flexWrap:'wrap',alignItems:'center'}}>
        <select value={mF} onChange={e=>setMF(e.target.value)} style={{width:'150px',flexShrink:0}}>
          {MONTHS.map(m=><option key={m.v} value={m.v}>{m.l}</option>)}
        </select>
        <select value={yF} onChange={e=>setYF(e.target.value)} style={{width:'110px',flexShrink:0}}>
          <option value="">All Years</option>
          {years.map(y=><option key={y} value={y}>{y}</option>)}
        </select>
        <div style={{flex:1,minWidth:'200px',position:'relative'}}>
          <span style={{position:'absolute',left:'11px',top:'50%',transform:'translateY(-50%)',color:'var(--text3)',pointerEvents:'none',fontSize:'13px'}}>🔍</span>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search no, party, vessel, port, job no…" style={{paddingLeft:'33px'}}/>
        </div>
        <ExportMenu filtered={filtered} mF={mF} yF={yF} enableFullExcel={enableFullExcel}/>
        {(mF||yF||q)&&<button className="btn btn-ghost btn-sm" onClick={()=>{setMF('');setYF('');setQ('');}}>✕ Clear</button>}
      </div>

      {/* Table */}
      {filtered.length===0?(
        <div style={{textAlign:'center',padding:'4rem 2rem',background:'var(--bg2)',borderRadius:'var(--rl)',color:'var(--text3)',border:'2px dashed var(--border)'}}>
          {invs.length===0?<><div style={{fontSize:'44px',marginBottom:'12px'}}>🧾</div>
            <div style={{fontSize:'16px',fontWeight:700}}>No invoices yet</div>
            <div style={{fontSize:'13px',marginTop:'6px'}}>Click "+ New Invoice" or import your Excel file to get started</div></>
          :'No invoices match your current filters.'}
        </div>
      ):(
        <div style={{background:'var(--card)',border:'1.5px solid var(--border)',borderRadius:'var(--rl)',overflow:'hidden',boxShadow:'var(--shadow)'}}>
          <table className="dtbl">
            <thead><tr>
              {['Invoice No','Date','Party Name','Vessel','Port','Job No.','Amount (₹)','Actions'].map(h=><th key={h}>{h}</th>)}
            </tr></thead>
            <tbody>
              {filtered.map(inv=>{
                const{fin}=calcInv(inv);
                return(
                  <tr key={inv.id} onClick={()=>onView(inv)}>
                    <td><span style={{color:'var(--accent)',fontWeight:700,fontFamily:'monospace',fontSize:'12px'}}>{inv.no||'—'}</span></td>
                    <td style={{color:'var(--text2)',fontSize:'12px',whiteSpace:'nowrap'}}>{fmtD(inv.date)}</td>
                    <td style={{maxWidth:'185px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:500}}>{inv.billing?.name||'—'}</td>
                    <td style={{maxWidth:'150px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'var(--text2)',fontSize:'12px'}}>{inv.vessel||'—'}</td>
                    <td style={{color:'var(--text2)',fontSize:'12px',maxWidth:'130px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{inv.port||'—'}</td>
                    <td style={{color:'var(--text2)',fontSize:'12px'}}>{inv.jobNo||'—'}</td>
                    <td style={{fontWeight:700,textAlign:'right',fontFamily:'monospace',fontSize:'13px',whiteSpace:'nowrap'}}>{inrI(fin)}</td>
                    <td onClick={e=>e.stopPropagation()} style={{width:'100px'}}>
                      <div style={{display:'flex',gap:'4px',justifyContent:'flex-end'}}>
                        <button className="btn btn-ghost btn-xs" onClick={()=>onEdit(inv)} title="Edit">✎</button>
                        <button className="btn btn-danger btn-xs" onClick={()=>onDel(inv.id)} title="Delete">✕</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div style={{padding:'9px 14px',borderTop:'1px solid var(--border)',fontSize:'12px',color:'var(--text3)',display:'flex',justifyContent:'space-between'}}>
            <span>{filtered.length} invoice{filtered.length!==1?'s':''} shown</span>
            {showFiltTotal&&<span style={{fontWeight:700}}>Total: ₹ {inrI(filtTotal)}</span>}
          </div>
        </div>
      )}
      <div style={{marginTop:'2.5rem',textAlign:'center',fontSize:'11px',color:'var(--text4)',paddingBottom:'1rem'}}>
        <a href="https://github.com/meetpalan-dev" target="_blank" rel="noreferrer"
          style={{color:'var(--text4)',textDecoration:'none'}} title="Developer: Meet Palan">
          Company Invoice App
        </a>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   FORM VIEW
═══════════════════════════════════════════════ */
function FormView({inv:init,onSave,onCancel,parties,ships,descs}){
  // Migrate legacy invoice fields for backward compat
  const migrateInv=raw=>{
    const inv=JSON.parse(JSON.stringify(raw));
    // Legacy: jobType='' or undefined → default to 'Job'
    if(!inv.jobType)inv.jobType='Job';
    // Legacy: poType='WO' remains valid (deriveRefLabel handles it)
    if(!inv.poType)inv.poType='PO';
    // Legacy: customRef/customRefLabel moved — jobType was 'Custom' → jobNo held the value
    // Nothing to migrate since storage was separate
    // Ensure no undefined fields
    if(!inv.cur)inv.cur='USD';
    return inv;
  };
  const[inv,setInv]=useState(()=>migrateInv(init));
  const C=useMemo(()=>calcInv(inv),[inv]);
  const sf=(f,v)=>setInv(p=>({...p,[f]:v}));
  const formRef=useRef();

  // Enter key → jump to next focusable field (skip checkboxes, buttons, textareas)
  function handleFormKeyDown(e){
    if(e.key!=='Enter')return;
    const tag=e.target.tagName;
    const type=(e.target.type||'').toLowerCase();
    // Allow Enter in textarea (multiline) and buttons naturally
    if(tag==='TEXTAREA'||tag==='BUTTON')return;
    // For select, let native Enter work
    if(tag==='SELECT')return;
    e.preventDefault();
    const focusable=Array.from(
      formRef.current.querySelectorAll('input,select,textarea,button')
    ).filter(el=>!el.disabled&&el.type!=='hidden'&&el.type!=='checkbox'&&el.tabIndex>=0&&el.closest('.no-print')===null);
    const idx=focusable.indexOf(e.target);
    if(idx>=0&&idx<focusable.length-1){
      focusable[idx+1].focus();
      // Select text content for easy overwrite
      if(focusable[idx+1].select)focusable[idx+1].select();
    }
  }

  function setBilling(v){
    const isGj=v.code==='24'||v.state?.toLowerCase().includes('gujarat');
    setInv(p=>({...p,billing:v,gst:isGj?'SC':'IG'}));
  }
  function updItem(idx,field,v){
    setInv(p=>{
      const items=[...p.items];
      const it={...items[idx],[field]:v};
      if(!['amount','taxable','discount'].includes(field)){
        const q2=parseFloat(it.qty)||0,r2=parseFloat(it.rate)||0;
        if(q2&&r2)it.amount=parseFloat((q2*r2).toFixed(2));
      }
      const a=parseFloat(it.amount)||0,d=parseFloat(it.discount)||0;
      it.taxable=parseFloat(Math.max(0,a-d).toFixed(2));
      items[idx]=it;return{...p,items};
    });
  }
  const addItem=()=>setInv(p=>({...p,items:[...p.items,{...blankItem(),sr:p.items.length+1}]}));
  const delItem=i=>setInv(p=>({...p,items:p.items.filter((_,j)=>j!==i)}));
  const td={padding:'4px 3px'};

  return(
    <div ref={formRef} onKeyDown={handleFormKeyDown} style={{maxWidth:'990px',margin:'0 auto',padding:'0 1rem 2.5rem'}}>
      {/* Sticky bar */}
      <div className="no-print" style={{position:'sticky',top:'44px',zIndex:10,background:'var(--bg)',borderBottom:'1.5px solid var(--border)',padding:'10px 0',marginBottom:'16px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'8px'}}>
        <h2 style={{fontSize:'16px',fontWeight:700,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          Tax Invoice&nbsp;<span style={{color:'var(--text3)',fontWeight:400,fontSize:'14px'}}>{inv.no||'— New Draft'}</span>
        </h2>
        <div style={{display:'flex',gap:'6px',flexShrink:0}}>
          <button className="btn btn-ghost btn-sm" onClick={onCancel}>Cancel</button>
          <button className="btn btn-primary btn-sm" onClick={()=>onSave(inv)}>Save &amp; Preview →</button>
        </div>
      </div>

      {/* Invoice Details */}
      <div className="card">
        <div className="sec-title">Invoice Details</div>
        <div className="g3">
          <div><label className="lbl">Invoice No *</label>
            <input value={inv.no||''} onChange={e=>sf('no',e.target.value)} placeholder="001/04/26-27 (auto)" style={{fontFamily:'monospace'}}/>
          </div>
          <div><label className="lbl">Invoice Date *</label>
            <input type="date" value={inv.date||''} onChange={e=>sf('date',e.target.value)}/>
          </div>
          <div><label className="lbl">Order Date</label>
            <input type="date" value={inv.oDate||''} onChange={e=>sf('oDate',e.target.value)}/>
          </div>
          <div><label className="lbl">Order Method</label>
            <SmartSelect value={inv.method||'E-MAIL'} options={METHODS} onChange={v=>sf('method',v)}/>
          </div>
          <div className="sp2"><label className="lbl">Port of Service</label>
            <SmartSelect value={inv.port||''} options={PORTS} onChange={v=>sf('port',v)}/>
          </div>

          {/* Ref fields — each spans 1.5 cols naturally in a 2-col sub-grid */}
          <div>
            <label className="lbl">Reference 1 (Job / Appt)</label>
            <RefField
              typeOptions={REF_TYPE_OPTIONS}
              typeValue={inv.jobType||'Job'}
              onTypeChange={v=>setInv(p=>({...p,jobType:v}))}
              value={inv.jobNo||''}
              onValueChange={v=>sf('jobNo',v)}
              customLabel={inv.customRefLabel||''}
              onCustomLabelChange={v=>sf('customRefLabel',v)}
              placeholder={inv.jobType==='Appointment'?'e.g. INIXY-00084A':inv.jobType==='PO'?'PO number':'e.g. CA00208347'}
            />
          </div>

          <div>
            <label className="lbl">Reference 2 (PO / WO)</label>
            <RefField
              typeOptions={REF_TYPE_OPTIONS}
              typeValue={inv.poType||'PO'}
              onTypeChange={v=>setInv(p=>({...p,poType:v}))}
              value={inv.poNo||''}
              onValueChange={v=>sf('poNo',v)}
              customLabel={inv.poCustomLabel||''}
              onCustomLabelChange={v=>sf('poCustomLabel',v)}
              placeholder={inv.poType==='Job'?'Job number':inv.poType==='Appointment'?'e.g. INIXY-00088A':'PO / WO number'}
            />
          </div>

          <div className="sp2"><label className="lbl">Vessel / Ship Name</label>
            <ACInput value={inv.vessel||''} suggestions={ships} minLen={2} placeholder="A/c. Master - m.t. VESSEL NAME"
              onChange={v=>sf('vessel',v)} onSelect={v=>sf('vessel',v)}/>
          </div>
        </div>
      </div>

      {/* Billing */}
      <div className="card">
        <div className="sec-title">Billing Party — Billed To</div>
        <PartyForm p={inv.billing} onChange={setBilling} parties={parties}/>
      </div>

      {/* Consignee */}
      <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div className="sec-title" style={{marginBottom:0}}>Consignee — Shipped To</div>
          <label style={{fontSize:13,display:'flex',alignItems:'center',gap:7,cursor:'pointer',fontWeight:600}}>
            <input type="checkbox" checked={inv.sameC} onChange={e=>sf('sameC',e.target.checked)}/>
            Same as billing party
          </label>
        </div>
        {inv.sameC
          ?<div style={{color:'var(--text3)',fontSize:13,fontStyle:'italic'}}>Consignee will match billing party on the invoice.</div>
          :<PartyForm p={inv.consignee||blankParty()} onChange={v=>sf('consignee',v)} parties={parties}/>
        }
      </div>

      {/* Items */}
      <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
          <div className="sec-title" style={{marginBottom:0}}>Service / Goods Items</div>
          <button className="btn btn-ghost btn-sm" onClick={addItem}>＋ Add Row</button>
        </div>
        <div style={{overflowX:'auto',marginBottom:'8px'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:'12px',minWidth:'730px'}}>
            <thead>
              <tr style={{background:'var(--bg3)'}}>
                {['Sr','Description','HSN/SAC','Qty','Rate','Per','Amount','Discount','Taxable Val.',''].map(h=>(
                  <th key={h} style={{padding:'7px 5px',textAlign:['Amount','Discount','Taxable Val.'].includes(h)?'right':'left',
                    fontWeight:700,color:'var(--text3)',borderBottom:'2px solid var(--border)',fontSize:'11px',whiteSpace:'nowrap'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {inv.items.map((it,idx)=>(
                <tr key={it.id||idx} style={{borderBottom:'1px solid var(--border)'}}>
                  <td style={{...td,width:'30px'}}><input value={it.sr||''} onChange={e=>updItem(idx,'sr',e.target.value)} style={{width:'26px',padding:'4px 3px',textAlign:'center'}}/></td>
                  <td style={{...td,minWidth:'210px'}}>
                    <ACInput value={it.desc||''} suggestions={descs} minLen={1} rows={2}
                      placeholder="Description of goods / service…"
                      onChange={v=>updItem(idx,'desc',v)} onSelect={v=>updItem(idx,'desc',v)}/>
                  </td>
                  <td style={{...td,width:'66px'}}><input value={it.hsn||''} onChange={e=>updItem(idx,'hsn',e.target.value)} style={{width:'62px',padding:'4px 4px'}}/></td>
                  <td style={{...td,width:'62px'}}><input value={it.qty||''} onChange={e=>updItem(idx,'qty',e.target.value)} style={{width:'58px',padding:'4px 4px'}}/></td>
                  <td style={{...td,width:'80px'}}><input type="number" value={it.rate||''} onChange={e=>updItem(idx,'rate',e.target.value)} style={{width:'76px',padding:'4px 4px'}}/></td>
                  <td style={{...td,width:'47px'}}><input value={it.per||''} onChange={e=>updItem(idx,'per',e.target.value)} placeholder="MT" style={{width:'43px',padding:'4px 3px'}}/></td>
                  <td style={{...td,width:'88px'}}><input type="number" value={it.amount||''} onChange={e=>updItem(idx,'amount',e.target.value)} style={{width:'84px',padding:'4px 4px'}}/></td>
                  <td style={{...td,width:'76px'}}><input type="number" value={it.discount||''} onChange={e=>updItem(idx,'discount',e.target.value)} style={{width:'72px',padding:'4px 4px'}}/></td>
                  <td style={{...td,textAlign:'right',fontWeight:700,width:'88px',whiteSpace:'nowrap',paddingRight:'8px'}}>₹{inr(it.taxable)}</td>
                  <td style={{...td,width:'24px'}}>
                    {inv.items.length>1&&<button onClick={()=>delItem(idx)}
                      style={{background:'none',border:'none',color:'var(--danger)',fontSize:'18px',lineHeight:1,cursor:'pointer',padding:'0 2px'}}>×</button>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{textAlign:'right',fontWeight:700,color:'var(--text2)',paddingRight:'8px',fontSize:13}}>
          Sub-Total:&nbsp;<span style={{color:'var(--accent)',fontSize:'16px',fontFamily:'monospace'}}>₹{inr(C.tv)}</span>
        </div>
      </div>

      {/* Tax */}
      <div className="g2">
        <div className="card">
          <div className="sec-title">Additional Charges</div>
          <div style={{display:'grid',gap:'10px'}}>
            <div><label className="lbl">Reverse Charges @ GST (₹)</label><input type="number" value={inv.rc||''} onChange={e=>sf('rc',e.target.value)} placeholder="0"/></div>
            <div><label className="lbl">Insurance Charges (₹)</label><input type="number" value={inv.ins||''} onChange={e=>sf('ins',e.target.value)} placeholder="0"/></div>
            <div><label className="lbl">Freight Charges (₹)</label><input type="number" value={inv.fr||''} onChange={e=>sf('fr',e.target.value)} placeholder="0"/></div>
          </div>
        </div>
        <div className="card">
          <div className="sec-title">Tax &amp; Currency</div>
          <div style={{marginBottom:'12px'}}>
            <label className="lbl">GST Type</label>
            <select value={inv.gst||'SC'} onChange={e=>sf('gst',e.target.value)} style={{fontWeight:600}}>
              <option value="SC">SGST 9% + CGST 9% — Intra-state (Gujarat)</option>
              <option value="IG">IGST 18% — Inter-state</option>
              <option value="NL">NIL GST — Exempt / Export</option>
            </select>
          </div>
          <div className="g2">
            <div><label className="lbl">Currency</label><SmartSelect value={inv.cur||'USD'} options={CURRENCIES} onChange={v=>sf('cur',v)}/></div>
            <div><label className="lbl">Exchange Rate (₹ / 1 {inv.cur||'USD'})</label>
              <input type="number" value={inv.exRate||''} onChange={e=>{
                const v=e.target.value;
                sf('exRate',v);
                // Auto-set USD if exchange rate entered and currency is INR
                if(v&&parseFloat(v)>1&&(inv.cur==='INR'||!inv.cur)){
                  setInv(p=>({...p,exRate:v,cur:'USD'}));
                }
              }} placeholder="e.g. 84.50"/>
            </div>
          </div>
        </div>
      </div>

      {/* Summary */}
      <div className="card" style={{background:'var(--bg3)',border:'1.5px solid var(--border2)'}}>
        <div className="sec-title">Invoice Summary</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(118px,1fr))',gap:'14px 22px',marginBottom:'14px'}}>
          {[['Taxable Value','₹'+inr(C.gt),false],
            inv.gst==='SC'&&['SGST 9%','₹'+inr(C.sg),false],
            inv.gst==='SC'&&['CGST 9%','₹'+inr(C.cg),false],
            inv.gst==='IG'&&['IGST 18%','₹'+inr(C.ig),false],
            ['Rounding Off',C.ro===0?'±0.00':C.ro.toFixed(2),false],
            ['Final Amount','₹'+inrI(C.fin),true],
          ].filter(Boolean).map(([k,v,hi])=>(
            <div key={k}>
              <div style={{fontSize:'11px',fontWeight:700,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:'4px'}}>{k}</div>
              <div style={{fontSize:hi?'22px':'15px',fontWeight:hi?800:500,color:hi?'var(--accent)':'var(--text)',fontFamily:'monospace'}}>{v}</div>
            </div>
          ))}
        </div>
        <div style={{padding:'9px 13px',background:'var(--accent-lt)',borderRadius:'var(--r)',fontSize:'12px',color:'var(--accent-txt)',fontStyle:'italic'}}>
          {toWords(C.fin)}
        </div>
      </div>

      {/* Extra */}
      <div className="card">
        <div className="sec-title">Additional Details</div>
        <div className="g3" style={{marginBottom:'12px'}}>
          <div><label className="lbl">E-Way Bill No</label><input value={inv.ewNo||''} onChange={e=>sf('ewNo',e.target.value)} placeholder="12-digit number"/></div>
          <div><label className="lbl">E-Way Bill Date</label><input type="date" value={inv.ewDt||''} onChange={e=>sf('ewDt',e.target.value)}/></div>
          <div><label className="lbl">Vehicle Regn. No</label><input value={inv.veh||''} onChange={e=>sf('veh',e.target.value)} placeholder="GJ 03 BV 6942"/></div>
        </div>
        <div className="g2">
          <div><label className="lbl">Remarks — Heading</label><input value={inv.rmk||''} onChange={e=>sf('rmk',e.target.value)} placeholder="e.g. EXCHANGE RATE"/></div>
          <div><label className="lbl">Remarks — Details</label><input value={inv.rmkD||''} onChange={e=>sf('rmkD',e.target.value)} placeholder="Further details"/></div>
        </div>
      </div>

      <div style={{display:'flex',justifyContent:'flex-end',gap:'8px',paddingTop:'4px'}}>
        <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
        <button className="btn btn-primary" style={{padding:'9px 26px',fontSize:'14px'}} onClick={()=>onSave(inv)}>Save &amp; Preview →</button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   PREVIEW VIEW
═══════════════════════════════════════════════ */
function PreviewView({inv,onBack,onEdit,logo,showEmptyFields}){
  const C=calcInv(inv);
  const[err,setErr]=useState('');
  const[duplicate,setDuplicate]=useState(false);
  function safeName(){
    const vessel=(inv.vessel||'').trim();
    if(vessel){
      const v=vessel.replace(/[^a-zA-Z0-9 _\-]/g,'').trim().replace(/\s+/g,' ');
      return`${v} Invoice`;
    }
    const no=(inv.no||'Draft').replace(/[^a-zA-Z0-9_\-]/g,'_').replace(/_+/g,'_');
    return`Invoice_${no}`;
  }
  function doPrint(){
    const el=document.getElementById('print-area');
    if(!el)return;
    const parent=el.parentNode;
    const sibling=el.nextSibling;
    document.body.appendChild(el);
    const p=document.title;
    document.title=safeName();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      window.print();
      setTimeout(()=>{
        document.title=p;
        parent.insertBefore(el,sibling);
      },2500);
    }));
  }

  return(
    <div>
      <div className="no-print" style={{padding:'10px 2rem',display:'flex',alignItems:'center',gap:'8px',
        borderBottom:'1.5px solid var(--border)',background:'var(--bg)',position:'sticky',top:'44px',zIndex:10,flexWrap:'wrap'}}>
        <button className="btn btn-ghost btn-sm" onClick={onBack}>← Back</button>
        <button className="btn btn-ghost btn-sm" onClick={onEdit}>✎ Edit</button>
        <button className="btn btn-ghost btn-sm" onClick={doPrint}>🖨 Print</button>
        {/* Duplicate checkbox */}
        <label style={{display:'flex',alignItems:'center',gap:'6px',cursor:'pointer',
          padding:'4px 10px',borderRadius:'var(--r)',fontSize:'12px',fontWeight:600,
          border:`1.5px solid ${duplicate?'var(--danger)':'var(--border2)'}`,
          background:duplicate?'var(--danger-bg)':'transparent',
          color:duplicate?'var(--danger)':'var(--text2)',
          transition:'all .15s',userSelect:'none'}}>
          <input type="checkbox" checked={duplicate} onChange={e=>setDuplicate(e.target.checked)}
            style={{accentColor:'var(--danger)',width:'auto',cursor:'pointer'}}/>
          📋 Duplicate
        </label>
        {duplicate&&<span style={{fontSize:'11px',color:'var(--text3)',fontStyle:'italic'}}>2 pages: Original + Duplicate</span>}
        {err&&<span style={{color:'var(--danger)',fontSize:'12px'}}>{err}</span>}
        <span style={{marginLeft:'auto',fontSize:'12px',color:'var(--text2)'}}>
          <span style={{fontFamily:'monospace',fontWeight:700,color:'var(--accent)'}}>{inv.no||'Draft'}</span>
          &nbsp;·&nbsp;{inv.billing?.name||'—'}
          &nbsp;·&nbsp;<b style={{fontSize:'14px'}}>₹ {inrI(C.fin)}</b>
        </span>
      </div>
      <div id="preview-wrap" style={{padding:'2rem',background:'var(--bg3)',minHeight:'calc(100vh - 100px)'}}>
        <div style={{maxWidth:'875px',margin:'0 auto',background:'#fff',
          boxShadow:'0 4px 28px rgba(0,0,0,.2)',borderRadius:'4px'}}>
          <div id="print-area" style={{padding:'18px 20px'}}>
            <InvPrint inv={inv} logo={logo} showEmptyFields={showEmptyFields} duplicate={duplicate}/>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   APP ROOT
═══════════════════════════════════════════════ */
function App(){
  const[dark,setDark]=useState(()=>ls.get(K.THEME,false));
  // Start with localStorage data immediately (synchronous), then upgrade from IDB
  const[invs,setInvs]=useState(()=>(ls.get(K.INVS,[])||[]).map(sanitizeInv));

  // On mount: load from IDB (may have more data than localStorage if ls was cleared)
  useEffect(()=>{
    idb.get(K.INVS,[]).then(idbData=>{
      if(!idbData||!idbData.length)return;
      const lsData=ls.get(K.INVS,[])||[];
      // Use IDB data if it has more invoices (more complete)
      if(idbData.length>lsData.length){
        setInvs(idbData.map(sanitizeInv));
        ls.set(K.INVS,idbData);// sync back to ls
      }
    }).catch(()=>{});
  },[]);
  const[xParties,setXParties]=useState(()=>ls.get(K.PARTIES,[]));
  const[xShips,setXShips]=useState(()=>ls.get(K.SHIPS,[]));
  const[xDescs,setXDescs]=useState(()=>ls.get(K.DESCS,[]));
  const[logo,setLogo]=useState(()=>ls.get(K.LOGO,'')||'');
  const[view,setView]=useState('list');
  const[cur,setCur]=useState(null);
  const[showSettings,setShowSettings]=useState(false);
  const[fsFileName,setFsFileName]=useState(()=>ls.get(K.FSFILE,'')||'');
  const[history,setHistory]=useState([]);
  const[showFiltTotal,setShowFiltTotal]=useState(()=>ls.get(K.SHOW_FTOTAL,false));
  const[showEmptyFields,setShowEmptyFields]=useState(()=>ls.get(K.SHOW_EMPTY_FIELDS,false));
  const[enableFullExcel,setEnableFullExcel]=useState(()=>ls.get(K.FULL_EXCEL,false));
  const[dateFmt,setDateFmtState]=useState(()=>{const f=ls.get(K.DATE_FMT,'DMY');_dateFmt=f;return f;});
  const toasts=useToast();
  const doSetDateFmt=useCallback(f=>{setDateFmt(f);setDateFmtState(f);},[]);

  // Unified suggestion pools — merge in-app + imported data
  const allParties=useMemo(()=>{
    const m={};
    [...extractParties(invs),...xParties].forEach(p=>{if(p?.name)m[p.gstin||p.name]={...p};});
    return Object.values(m);
  },[invs,xParties]);

  const allShips=useMemo(()=>[...new Set([
    ...extractShips(invs),
    ...(xShips||[]).map(s=>String(s||'').trim()).filter(s=>s.length>2),
  ])],[invs,xShips]);
  const allDescs=useMemo(()=>{
    // Priority: 1. Default predefined list, 2. User-learned from in-app invoices
    // Do NOT use xDescs (old imported Excel descriptions)
    const learnedFromInvoices=extractDescs(invs);
    // Merge: defaults first, then learned — deduplicated, case-insensitive
    const seen=new Set(DEFAULT_DESCS.map(d=>d.toUpperCase()));
    const learned=learnedFromInvoices.filter(d=>!seen.has(d.toUpperCase()));
    // Also include xDescs that are user-created (stored in v2 key = clean learned data only)
    const extraLearned=(xDescs||[]).map(d=>String(d||'').trim()).filter(d=>d.length>=3&&!seen.has(d.toUpperCase()));
    return[...DEFAULT_DESCS,...learned,...extraLearned];
  },[invs,xDescs]);

  // Global keyboard shortcuts
  useEffect(()=>{
    const h=e=>{
      // Ignore when typing in an input/textarea/select
      if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
      if(e.key==='n'&&view==='list'){doNew();}
      if(e.key==='Escape'&&view!=='list'){setView('list');}
    };
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[view]);

  function persistInvs(list){
    // 1. localStorage (fast, synchronous — always first)
    ls.set(K.INVS,list);
    // 2. IndexedDB (durable, survives storage pressure)
    idb.set(K.INVS,list).catch(()=>{});
    // 3. File-system linked file (optional, if user set it up in Settings)
    fsSave({version:5,exported:new Date().toISOString(),invoices:list}).catch(()=>{});
  }
  async function pickFile(){
    const ok=await fsPick({version:5,exported:new Date().toISOString(),invoices:invs});
    if(ok){const n=_fsH?.name||'invoices.json';setFsFileName(n);ls.set(K.FSFILE,n);toast('File linked — auto-save enabled!','success');}
    else toast('File link cancelled or unsupported in this browser.','info');
  }
  function pushHist(snap){setHistory(h=>[...h.slice(-4),JSON.parse(JSON.stringify(snap))]);}
  function saveInvs(list){pushHist(invs);setInvs(list);persistInvs(list);}

  function doUndo(){
    if(!history.length)return;
    const prev=history[history.length-1];
    setHistory(h=>h.slice(0,-1));
    setInvs(prev);persistInvs(prev);
    toast(`Undo: restored ${prev.length} invoice(s).`,'info');
  }
  function onLogoChange(data){setLogo(data);ls.set(K.LOGO,data);}
  const toggleDark=()=>setDark(d=>{ls.set(K.THEME,!d);return!d;});
  const toggleFiltTotal=()=>setShowFiltTotal(v=>{ls.set(K.SHOW_FTOTAL,!v);return!v;});
  const toggleShowEmptyFields=()=>setShowEmptyFields(v=>{ls.set(K.SHOW_EMPTY_FIELDS,!v);return!v;});
  const toggleFullExcel=()=>setEnableFullExcel(v=>{ls.set(K.FULL_EXCEL,!v);return!v;});
  const doNew=()=>{setCur(newInv(invs));setView('form');};
  const doEdit=inv=>{setCur(JSON.parse(JSON.stringify(inv)));setView('form');};
  const doView=inv=>{setCur(inv);setView('preview');};
  const doDel=id=>{
    if(!window.confirm('Delete this invoice? Use Undo to restore.'))return;
    saveInvs(invs.filter(i=>i.id!==id));
    toast('Deleted. Use ↩ Undo to restore.','info');
  };
  const doSave=inv=>{
    const cleanedInv=sanitizeInv(inv);
    const list=invs.find(i=>i.id===cleanedInv.id)?invs.map(i=>i.id===cleanedInv.id?cleanedInv:i):[...invs,cleanedInv];
    saveInvs(list);
    setCur(cleanedInv);
    setView('preview');
    toast('Invoice saved!','success');
  };
  const doClearAll=()=>{saveInvs([]);setShowSettings(false);toast('All invoices cleared.','info');};

  // Unified import: JSON, or Excel (both parties/ships AND full invoice conversion)
  const doImport=()=>{
    const inp=document.createElement('input');
    inp.type='file';inp.accept='.json,.xlsx,.xlsm,.xls';
    inp.onchange=async e=>{
      const f=e.target.files[0];if(!f)return;
      const ext=f.name.split('.').pop().toLowerCase();

      if(ext==='json'){
        const r=new FileReader();
        r.onload=ev=>{
          try{
            const data=JSON.parse(ev.target.result);
            // Handles both formats:
            //   {version:5, invoices:[...]}  ← Invoice_Backup_YYYY-MM-DD.json
            //   [{id:..., no:...}, ...]       ← raw array
            const imported=(Array.isArray(data)?data:(data.invoices||[])).map(sanitizeInv);
            if(!imported.length)throw new Error('No invoices found in file');
            const isBackup=!Array.isArray(data)&&data.version&&data.exported;
            const label=isBackup?`backup from ${data.exported?.slice(0,10)||'?'}`:'JSON file';
            if(!window.confirm(`Import ${imported.length} invoice(s) from ${label}?\nWill MERGE with your existing ${invs.length} invoice(s). Duplicates are skipped.`))return;
            const merged=[...invs];
            imported.forEach(ni=>{if(!merged.find(ex=>ex.id===ni.id))merged.push(ni);});
            saveInvs(merged);
            toast(`✓ Imported ${imported.length} invoices from ${label}. Total: ${merged.length}.`,'success');
          }catch(err){toast('Import failed: '+err.message,'error');}
        };
        r.readAsText(f);
      } else {
        // Excel: import from Full Export format (generated by this app)
        try{
          toast('Reading Excel file…','info');
          const xlInvs=await xlsxToInvoices(f);

          // Extract suggestions from imported invoices
          const newParties=extractParties(xlInvs);
          const newShips=extractShips(xlInvs);
          const newDescs=extractDescs(xlInvs);

          // Merge suggestion pools
          const pm={};[...xParties,...newParties].forEach(p=>{if(p?.name)pm[p.gstin||p.name]={...p};});
          const mergedP=Object.values(pm);ls.set(K.PARTIES,mergedP);setXParties(mergedP);
          const mergedS=[...new Set([...xShips,...newShips])];ls.set(K.SHIPS,mergedS);setXShips(mergedS);
          const mergedD=[...new Set([...xDescs,...newDescs])];ls.set(K.DESCS,mergedD);setXDescs(mergedD);

          if(xlInvs.length>0){
            if(!window.confirm(`Found ${xlInvs.length} invoice(s) in Excel. Import and merge with existing ${invs.length}?`))return;
            const merged=[...invs];
            xlInvs.forEach(ni=>{
              const dup=merged.find(ex=>ex.no&&ex.no===ni.no&&ex.date===ni.date);
              if(!dup)merged.push(ni);
            });
            saveInvs(merged);
            toast(`Imported: ${xlInvs.length} invoices, ${newParties.length} parties, ${newShips.length} vessels.`,'success');
          } else {
            toast('No invoices found. Make sure you import a Full Export (.xlsx) file from this app.','info');
          }
        }catch(err){toast('Excel import failed: '+err.message,'error');console.error(err);}
      }
    };
    inp.click();
  };

  return(
    <div className={dark?'dark':''} style={{minHeight:'100vh',background:'var(--bg)',color:'var(--text)',transition:'background .22s,color .22s'}}>
      {/* Nav */}
      <div className="no-print" style={{background:'var(--bg2)',borderBottom:'1.5px solid var(--border)',
        padding:'0 2rem',display:'flex',alignItems:'center',justifyContent:'space-between',
        height:'44px',position:'sticky',top:0,zIndex:50,boxShadow:'var(--shadow)'}}>
        <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
          {logo&&<img src={logo} style={{height:'28px',width:'auto',objectFit:'contain'}} alt="logo"/>}
          <span style={{fontWeight:900,fontSize:'15px',letterSpacing:'-.01em',color:'var(--accent)'}}>INV</span>
          <span style={{color:'var(--border2)',fontSize:'20px',lineHeight:1,opacity:.5}}>|</span>
          <span style={{fontSize:'13px',fontWeight:600,color:'var(--text2)'}}>Invoice App</span>
          {view!=='list'&&<span style={{fontSize:'12px',color:'var(--text3)'}}>› {view==='form'?'Edit':'Preview'}</span>}
        </div>
        <button className="btn btn-ghost btn-sm" onClick={toggleDark} style={{fontSize:'12px'}}>
          {dark?'☀ Light':'🌙 Dark'}
        </button>
      </div>

      {view==='list'&&<ListView invs={invs} onNew={doNew} onEdit={doEdit} onView={doView}
        onDel={doDel} onImport={doImport}
        onUndo={doUndo} undoCount={history.length} onOpenSettings={()=>setShowSettings(true)}
        showFiltTotal={showFiltTotal} enableFullExcel={enableFullExcel}/>}
      {view==='form'&&<FormView inv={cur} onSave={doSave} onCancel={()=>setView('list')}
        parties={allParties} ships={allShips} descs={allDescs}/>}
      {view==='preview'&&<PreviewView inv={cur} onBack={()=>setView('list')} onEdit={()=>doEdit(cur)} logo={logo} showEmptyFields={showEmptyFields}/>}

      {showSettings&&<SettingsModal onClose={()=>setShowSettings(false)} invs={invs}
        onClearAll={doClearAll} fsFileName={fsFileName} onPickFile={pickFile}
        logo={logo} onLogoChange={onLogoChange}
        showFiltTotal={showFiltTotal} onToggleFiltTotal={toggleFiltTotal}
        showEmptyFields={showEmptyFields} onToggleShowEmptyFields={toggleShowEmptyFields}
        enableFullExcel={enableFullExcel} onToggleFullExcel={toggleFullExcel}
        dateFmt={dateFmt} onDateFmt={doSetDateFmt}
        onImportBackup={doImport}/>}

      <div className="toast-wrap">
        {toasts.map(t=>(
          <div key={t.id} className={`toast toast-${t.type==='error'?'error':t.type==='success'?'success':'info'}`}>
            {t.type==='success'?'✓ ':t.type==='error'?'✕ ':'ℹ '}{t.msg}
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
